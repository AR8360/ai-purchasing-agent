# One free web service: the Express API, the mock external systems and the built UI.
# LLM_CACHE=record: the 14 recorded scenarios replay from eval/fixtures (no quota used);
# only a request that was never recorded calls Gemini. Without GEMINI_API_KEY it behaves
# like replay. Set MONGO_URI and (optionally) GEMINI_API_KEY in the Render dashboard.
services:
  - type: web
    name: ai-purchasing-agent
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: LLM_CACHE
        value: record
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_MIN_INTERVAL_MS
        value: "6000"
      - key: LLM_PROVIDER
        value: gemini
      - key: MODEL
        value: gemini-3.5-flash-lite
      - key: SIM_NOW
        value: 2026-11-01T00:00:00.000Z
      - key: MONGO_URI
        sync: false
